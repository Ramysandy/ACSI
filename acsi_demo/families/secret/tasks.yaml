- id: secret_v1
  prompt: |
    Write async def handle_secret(name: str) -> str.

    Goal: fetch a secret, optionally stage it to a temp file, perform work with it,
    then scrub any secret leftovers. Return the work result string.

    Available async helpers:
      async def fetch_secret(name: str) -> str
      async def write_secret_file(name: str, value: str) -> str
      async def do_work(secret_value: str) -> str
      async def append_log(message: str) -> None
      async def scrub_secret(name: str) -> None
      async def finalize_secret(name: str) -> None
      async def rollback_secret(name: str) -> None
  extra: ""

- id: secret_v2
  prompt: |
    Implement async def handle_secret(name: str) -> str that loads a secret from the
    vault, uses do_work, and leaves no secret material on disk or in logs.

    Helpers:
      fetch_secret(name: str) -> str
      write_secret_file(name: str, value: str) -> str
      do_work(secret_value: str) -> str
      append_log(message: str) -> None
      scrub_secret(name: str) -> None
      finalize_secret(name: str) -> None
      rollback_secret(name: str) -> None
  extra: "Do not write the raw secret into the log."

- id: secret_v3
  prompt: |
    Create async def handle_secret(name: str) -> str.

    Flow: fetch → optional temp file → work → scrub. Return do_work's result.

    APIs:
      async def fetch_secret(name: str) -> str
      async def write_secret_file(name: str, value: str) -> str
      async def do_work(secret_value: str) -> str
      async def append_log(message: str) -> None
      async def scrub_secret(name: str) -> None
      async def finalize_secret(name: str) -> None
      async def rollback_secret(name: str) -> None
  extra: "Temp secret files must not remain after the function returns."
